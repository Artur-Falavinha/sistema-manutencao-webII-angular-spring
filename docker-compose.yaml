name: manutencao-defesa

services:
  frontend:
    build:
      context: ./front-end
      dockerfile: front.dockerfile
    ports:
      - "127.0.0.1:${MANUTENCAO_PORT:-4302}:4200"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--max_old_space_size=4096
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./back-end
      dockerfile: back.dockerfile
      target: prod
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./back-end/config:/app/config:ro
    environment:
      - TZ=America/Sao_Paulo
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/remont_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=never
      - APP_DEFENSE_SEED=true
      - APP_JWT_SECRET
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-mailpit}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-manutencao-local}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_FROM=${SPRING_MAIL_FROM:-manutencao@example.test}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-false}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS:-false}
    restart: unless-stopped

  mysql:
    image: mysql:latest
    environment:
      - TZ=America/Sao_Paulo
      - MYSQL_USER=springuser
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=remont_db
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      timeout: 20s
      retries: 10
      interval: 10s 
      
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MANUTENCAO_MAIL_PORT:-18027}:8025"
    restart: unless-stopped

volumes:
  mysql-data:
