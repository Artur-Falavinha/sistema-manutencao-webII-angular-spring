<div class="modal-overlay" *ngIf="mostrar">
  <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="success-modal-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <div class="modal-content">
      <div class="success-icon">
        <i>✓</i>
      </div>
      
      <h2 id="success-modal-title" class="modal-title">{{ titulo }}</h2>
      <p class="modal-subtitle">{{ subtitulo }}</p>
      
      <!-- Exibe dados adicionais apenas se foram fornecidos -->
      <div class="modal-additional" *ngIf="dadosAdicionais">
        <p>{{ dadosAdicionais }}</p>
      </div>
      
      <button class="modal-button" cdkFocusInitial (click)="fecharModal()">
        {{ textoBotao }}
      </button>
    </div>
  </div>
</div>
