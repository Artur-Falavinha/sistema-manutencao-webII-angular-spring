<div class="card-container" (click)="verServico(request.id)">
  <div class="card-content">
    <h6 class="heading_6 equipment-name" [title]="request.equipmentName">{{ request.equipmentName | truncate:30 }}</h6>
    <div class="card-infos">
      <div class="info-container">
        <div class="info-label">
          <mat-icon fontIcon="category"></mat-icon>
          <p class="label_medium">Categoria</p>
        </div>
        <span class="info-value">{{
          request.categoryName
        }}</span>
      </div>
      <div class="info-container">
        <div class="info-label">
          <mat-icon fontIcon="person"></mat-icon>
          <p class="label_medium">Cliente</p>
        </div>
        <span class="info-value">{{
          request.clientName
        }}</span>
      </div>
      <div class="info-container">
        <div class="info-label">
          <mat-icon fontIcon="schedule"></mat-icon>
          <p class="label_medium">Data e horário</p>
        </div>
        <span class="info-value">{{ request.requestDate | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
    </div>
    <!-- Botões vindos da tela via ng-content; o clique neles não abre o card -->
    <div class="card-actions" (click)="$event.stopPropagation()">
      <ng-content></ng-content>
    </div>
  </div>
</div>
