<app-dialog-shell
  title="Confirmar resgate do serviço"
  description="A solicitação voltará para o fluxo com status aprovado."
  [showWarningIcon]="true"
>
  <div class="confirm-details">
    <p><span class="detail-label">Equipamento:</span> {{ data.equipmentName }}</p>
    @if (data.total !== undefined) {
      <p><span class="detail-label">Valor do serviço:</span> {{ data.total | currency:'BRL' }}</p>
    }
    <p class="confirm-note">O orçamento rejeitado será resgatado e passará de <strong>REJEITADA</strong> para <strong>APROVADA</strong>.</p>
  </div>

  <div dialog-action class="dialog-shell__action-group">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="button" (click)="onConfirm()">
      Confirmar resgate
    </button>
  </div>
</app-dialog-shell>
