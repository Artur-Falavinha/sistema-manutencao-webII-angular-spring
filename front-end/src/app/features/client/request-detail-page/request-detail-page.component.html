@if (isLoading) {
  <div class="loading-state">Carregando detalhes...</div>
}
@if (request; as detail) {
<main>
  <div class="header-wrapper">
    <a routerLink="/client/dashboard" class="label_large back-link">
      <mat-icon>arrow_back</mat-icon>Voltar para Página Inicial
    </a>
    @if (detail.status.nome === 'ARRUMADA') {
    <button mat-flat-button color="primary" type="button" class="label_large" (click)="goToPaymentPage()">
      Pagar Solicitação <mat-icon>payment</mat-icon>
    </button>
    } @else {
      <div></div>
    }
  </div>
  <div class="content-wrapper">
    <div class="details-section">
      <app-request-description [request]="detail"></app-request-description>
      <app-approve-reject-panel [request]="detail" (statusChanged)="loadRequestDetails($event)"></app-approve-reject-panel>
    </div>
    <app-request-history style="height: 100%;" [history]="detail.history"></app-request-history>
  </div>
</main>
}
