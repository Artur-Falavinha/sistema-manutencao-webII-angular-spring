<mat-toolbar class="app-header">
  <div class="header-left">
    @if (!isSidebarExpanded() || !(isEmployee$ | async)) {
    <img src="assets/images/logo.png" alt="Logo" class="logo" />
    }
  </div>

  <div class="header-right">
    <span class="body_medium">Olá {{ (currentUser$ | async)?.name }}</span>

    <div class="user-avatar">
      <mat-icon>account_circle</mat-icon>
    </div>
    <button mat-button type="button" class="logout-button" aria-label="Sair" (click)="logout()">
      <span class="body_medium">Sair</span>
      <mat-icon>exit_to_app</mat-icon>
    </button>
  </div>
</mat-toolbar>
